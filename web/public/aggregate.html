<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆总成 · Castalia</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #07090D; --panel: #12171F; --border: rgba(255,255,255,0.08);
    --text: #E8EDF2; --dim: #8A94A3; --accent: #3EE8C8; --accent2: #7EB0FF;
    --ok: #57E6C4; --warn: #F5B942; --err: #f4554f;
    --hermes: #5FF5D6; --lobehub: #7EB0FF; --airi: #FF8FB8; --fed: #FFD056;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif; padding: 0 28px 48px; }
  .app-head { display: flex; align-items: center; gap: 14px; height: 56px; margin: 0 -28px 22px; padding: 0 28px;
    background: #080A0F; border-bottom: 1px solid var(--border); }
  .brand { font-weight: 650; color: #fff; text-decoration: none; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .brand em { font-style: normal; color: var(--accent); font-size: 12px; margin-left: 8px; font-weight: 500; }
  .maps { display: flex; gap: 3px; background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .maps a { color: var(--dim); text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 8px; }
  .maps a:hover { color: var(--text); }
  .maps i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .pages { margin-left: auto; display: flex; gap: 6px; }
  .pages a { color: var(--dim); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 8px; }
  .pages a.active, .pages a:hover { color: var(--accent); }
  header.page { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; color: var(--text); font-weight: 650; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 13px; margin-left: 10px; }
  #totals { color: var(--dim); font-size: 13px; margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { font-size: 14px; margin-bottom: 8px; }
  .card .lib { color: var(--accent); font-weight: 600; }
  .card .proj { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .card .nums { display: flex; gap: 16px; font-size: 13px; margin-top: 6px; }
  .card .nums b { color: var(--ok); }
  .card .last { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .card .err { color: var(--err); font-size: 11px; margin-top: 6px; }
  .total-banner { background: linear-gradient(135deg, rgba(124,111,247,.15), rgba(88,166,255,.1)); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; font-size: 14px; }
  .total-banner b { color: var(--accent); font-size: 20px; }
  section { margin-bottom: 24px; }
  h2 { font-size: 15px; color: var(--accent2); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type=text] { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
  input[type=text]:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  .result { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .result .meta { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .result .meta .inst { color: var(--accent2); }
  .result .meta .proj { color: var(--accent); }
  .result .txt { font-size: 13px; line-height: 1.5; }
  .empty { color: var(--dim); font-size: 13px; padding: 12px 0; }
  .feed-item { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .feed-item .time { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .feed-item .where { color: var(--accent2); font-size: 11px; white-space: nowrap; }
  .feed-item .txt { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .create-row { display: flex; gap: 8px; max-width: 460px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 8px; }
  #status { font-size: 12px; margin-left: 8px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
</style>
</head>
<body>
<div class="app-head">
  <a class="brand" href="http://127.0.0.1:3345/?scope=federation"><img src="/castalia-mark.png" alt="">Castalia <em>总成</em></a>
  <nav class="maps">
    <a href="http://127.0.0.1:3345/?scope=federation"><i style="background:var(--fed)"></i>联邦</a>
    <a href="http://127.0.0.1:3345/?scope=local"><i style="background:var(--hermes)"></i>Hermes</a>
    <a href="http://127.0.0.1:3346/?scope=local"><i style="background:var(--lobehub)"></i>LobeHub</a>
    <a href="http://127.0.0.1:3344/?scope=local"><i style="background:var(--airi)"></i>AIRI</a>
  </nav>
  <nav class="pages">
    <a class="active" href="/aggregate.html">总成</a>
    <a href="/manage.html">库管理</a>
  </nav>
</div>
<header class="page">
  <h1>记忆总成<small>全机记忆库总览 · 跨库搜索 · 最近动态</small></h1>
  <div id="totals"></div>
</header>

<div class="total-banner" id="banner">加载中…</div>

<section>
  <h2>📚 库管理</h2>
  <div class="grid" id="libs"></div>
  <div class="create-row">
    <input type="text" id="newLib" placeholder="新库名（字母/数字/._-，如 custom-project、shared）" onkeydown="if(event.key==='Enter')createLib()">
    <button onclick="createLib()">建库</button>
    <span id="status"></span>
  </div>
  <div class="note">约定：库名 <b>shared</b> 为共享层（互通语义待定，引擎不自动合并库）。各库记忆彼此隔离，跨库搜索需显式发起。</div>
</section>

<section>
  <h2>🔍 聚合搜索（全部库）</h2>
  <div class="search-row">
    <input type="text" id="q" placeholder="输入关键词，搜全部库…" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div id="results"></div>
</section>

<section>
  <h2>🕐 最近动态（全部库）</h2>
  <div id="feed"></div>
</section>

<script>
async function j(url, opt) {
  const r = await fetch(url, opt);
  return r.json();
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(t) { if (!t) return '—'; const d = new Date(t.replace(' ', 'T') + 'Z'); if (isNaN(d)) return t; return d.toLocaleString('zh-CN', { hour12: false }); }

async function loadOverview() {
  try {
    const d = await j('/api/aggregate/overview');
    const libs = d.libraries || [];
    const total = libs.reduce((a, l) => a + (l.memories || 0), 0);
    const facts = libs.reduce((a, l) => a + (l.facts || 0), 0);
    document.getElementById('banner').innerHTML = `全机 <b>${libs.length}</b> 个库 · 记忆 <b>${total}</b> 条 · 事实 <b>${facts}</b> 条`;
    document.getElementById('totals').textContent = `实例: ${[...new Set(libs.map(l => l.instance))].join(' / ')}`;
    const box = document.getElementById('libs');
    box.innerHTML = libs.map(l => `
      <div class="card">
        <h3><span class="lib">${esc(l.instance)}</span><span class="proj">${esc(l.project)}</span></h3>
        <div class="nums">记忆 <b>${l.memories ?? 0}</b> 事实 <b>${l.facts ?? 0}</b></div>
        <div class="last">最近: ${fmtTime(l.lastActivity)}</div>
        ${l.error ? `<div class="err">⚠ ${esc(l.error)}</div>` : ''}
      </div>`).join('') || '<div class="empty">暂无库</div>';
  } catch (e) {
    document.getElementById('banner').innerHTML = `<span class="err">总览加载失败: ${esc(e.message)}</span>`;
  }
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  const box = document.getElementById('results');
  if (!q) { box.innerHTML = '<div class="empty">输入关键词再搜</div>'; return; }
  box.innerHTML = '<div class="empty">搜索中…</div>';
  try {
    const d = await j('/api/aggregate/search?q=' + encodeURIComponent(q) + '&topK=10');
    if (!d.ok) { box.innerHTML = `<div class="empty">${esc(d.error || '搜索失败')}</div>`; return; }
    box.innerHTML = d.count === 0
      ? '<div class="empty">没有命中</div>'
      : d.results.map(r => `
        <div class="result">
          <div class="meta">[<span class="inst">${esc(r.instance)}</span> · <span class="proj">${esc(r.project)}</span>] 匹配 ${r.score} · ${fmtTime(r.createdAt)}</div>
          <div class="txt">${esc(r.text)}</div>
        </div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function loadFeed() {
  const box = document.getElementById('feed');
  try {
    const d = await j('/api/aggregate/recent?limit=30');
    box.innerHTML = d.count === 0
      ? '<div class="empty">还没有记忆</div>'
      : d.results.map(r => `
        <div class="feed-item">
          <span class="where">${esc(r.instance)}/${esc(r.project)}</span>
          <span class="txt" title="${esc(r.text)}">${esc(r.text)}</span>
          <span class="time">${fmtTime(r.createdAt)}</span>
        </div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function createLib() {
  const name = document.getElementById('newLib').value.trim();
  const st = document.getElementById('status');
  if (!name) { st.innerHTML = '<span class="err">库名不能为空</span>'; return; }
  st.innerHTML = '建库中…';
  try {
    const d = await j('/api/aggregate/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    st.innerHTML = d.ok ? `<span class="ok">✅ 已建库 ${esc(d.project)}</span>` : `<span class="err">❌ ${esc(d.error || '失败')}</span>`;
    document.getElementById('newLib').value = '';
    loadOverview(); loadFeed();
  } catch (e) {
    st.innerHTML = `<span class="err">❌ ${esc(e.message)}</span>`;
  }
}

loadOverview();
loadFeed();
</script>
</body>
</html>
